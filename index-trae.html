/* === Layout & Component Styles === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 11px; }
body {
  font-family: "SF Pro Text", system-ui, -apple-system, sans-serif;
  background: var(--bg-base-default); color: var(--text-default);
  line-height: 1.35; min-height: 100vh;
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-neutral-l2); border-radius: 3px; }

.dashboard { max-width: 1440px; margin: 0 auto; padding: 4px 8px; }

.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--spacer-8) 0; border-bottom: 1px solid var(--border-neutral-l1);
  margin-bottom: var(--spacer-12);
}
.header-left { display: flex; align-items: center; gap: 4px; }
.header-icon { width: 22px; height: 22px; background: var(--bg-brand); border-radius: var(--radius-4); display: flex; align-items: center; justify-content: center; color: #0C0C0D; font-weight: 700; font-size: 11px; }
.header h1 { font-size: 12px; font-weight: 600; color: var(--text-default-hover); letter-spacing: 0.3px; }
.header-time { font-size: 9px; color: var(--text-tertiary); }

.kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 4px; }
@media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 480px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }

.kpi-card { background: var(--bg-base-secondary); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-6); padding: var(--spacer-8) var(--spacer-12); position: relative; overflow: hidden; }
.kpi-card:hover { border-color: var(--border-neutral-l2); }
.kpi-label { font-size: 9px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.kpi-value { font-size: 20px; font-weight: 600; color: var(--text-default-hover); line-height: 1.1; }
.kpi-sub { font-size: 8px; color: var(--text-tertiary); margin-top: 1px; }
.kpi-accent { position: absolute; top: 0; left: 0; width: 3px; height: 100%; }
.kpi-accent.green { background: var(--bg-brand); }
.kpi-accent.blue { background: var(--status-primary-default); }
.kpi-accent.amber { background: var(--status-alert-default); }
.kpi-accent.purple { background: var(--viz-series-violet); }
.kpi-accent.coral { background: var(--viz-series-coral); }
.kpi-accent.teal { background: var(--viz-series-teal); }

.section { margin-bottom: var(--spacer-12); }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.section-title { font-size: 12px; font-weight: 500; color: var(--text-default-hover); }
.section-badge { font-size: 8px; color: var(--text-tertiary); background: var(--bg-base-tertiary); padding: 1px 4px; border-radius: var(--radius-full); }

.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacer-8); }
@media (max-width: 768px) { .chart-grid { grid-template-columns: 1fr; } }
.chart-card { background: var(--bg-base-secondary); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-6); padding: 4px 8px; min-height: 0; }
.chart-card h3 { font-size: 10px; font-weight: 500; color: var(--text-secondary); margin-bottom: var(--spacer-4); text-transform: uppercase; letter-spacing: 0.5px; }
.chart-container { width: 100%; height: 150px; }

.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--spacer-8); }
@media (max-width: 900px) { .grid-3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) { .grid-3 { grid-template-columns: 1fr; } }

.scroll-list { max-height: 110px; overflow-y: auto; }

.summary-card { background: var(--bg-base-secondary); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-6); padding: 4px 8px; }
.summary-text { font-size: 9px; color: var(--text-secondary); line-height: 1.35; }

.issue-item { padding: 2px 0; border-bottom: 1px solid var(--border-neutral-l1); font-size: 9px; display: flex; align-items: flex-start; gap: 3px; }
.issue-item:last-child { border-bottom: none; }
.issue-dot { width: 4px; height: 4px; border-radius: 50%; margin-top: 3px; flex-shrink: 0; }
.issue-dot.error { background: var(--status-error-default); }
.issue-dot.warning { background: var(--status-alert-default); }
.issue-dot.info { background: var(--status-primary-default); }

.log-item { padding: 2px 0; border-bottom: 1px solid var(--border-neutral-l1); }
.log-item:last-child { border-bottom: none; }
.log-date { font-size: 8px; color: var(--text-tertiary); margin-bottom: 1px; }
.log-preview { font-size: 9px; color: var(--text-secondary); line-height: 1.3; }

.wiki-tag { display: inline-flex; align-items: center; gap: 2px; padding: 1px 4px; border-radius: var(--radius-4); font-size: 8px; margin: 1px; background: var(--bg-overlay-l1); color: var(--text-default); }
.wiki-tag .freq { color: var(--text-tertiary); font-size: 7px; }

.footer { text-align: center; padding: 2px 0; border-top: 1px solid var(--border-neutral-l1); font-size: 8px; color: var(--text-tertiary); }
.empty-state { text-align: center; padding: 4px; color: var(--text-tertiary); font-size: 9px; }
</style>
</head>

  renderKPI(data);
  renderNotesDistChart(data);
  renderWikiCatChart(data);

  renderBriefsChart(data);
  renderWikiTopList(data);

}

function renderKPI(d) {
  const s = d.summary;
  const items = [
    { label:'总笔记数', value:s.total_md, accent:'green', sub:'含 7 大核心目录' },
    { label:'Notes', value:s.dir_counts.Notes||0, accent:'blue', sub:(d.notes_breakdown.Notes?Object.keys(d.notes_breakdown.Notes).length:0)+' 个子目录' },
    { label:'wiki 词条', value:s.wiki_count, accent:'purple', sub:(d.wiki_tags.by_category?Object.keys(d.wiki_tags.by_category).length:0)+' 个分类' },
    { label:'Ideas', value:s.dir_counts.Ideas||0, accent:'teal', sub:'原创思考与认知简报' },
    { label:'Inbox', value:s.inbox_count, accent:'amber', sub:'待归档素材' },
    { label:'结构问题', value:d.structural_issues.length, accent:'coral', sub:'需关注' },
  ];
  document.getElementById('kpiGrid').innerHTML = items.map(item => `
    <div class="kpi-card"><div class="kpi-accent ${item.accent}"></div>
      <div class="kpi-label">${item.label}</div>
      <div class="kpi-value">${item.value}</div>
      <div class="kpi-sub">${item.sub}</div>
    </div>`).join('');
}

function renderNotesDistChart(d) {

  const chart = echarts.init(document.getElementById('chartNotesDist'));
  const nb = d.notes_breakdown.Notes||{};
  const names = Object.keys(nb), vals = Object.values(nb);
  const colors = ['#32F08C','#387BFF','#B655FC','#78F2F2','#F87454','#EDAA45','#1DC981','#22A5F7','#FB9DD7','#B6A3FF','#A6EA39','#859EAD'];
  chart.setOption({
    tooltip:{trigger:'item',backgroundColor:'#1A1B1D',borderColor:'rgba(224,226,242,0.16)',textStyle:{color:'#D1D3DB',fontSize:11}},
    series:[{type:'pie',radius:['28%','62%'],center:['50%','55%'],data:names.slice(0,12).map((n,i)=>({value:vals[i],name:n,itemStyle:{color:colors[i%colors.length]}})),label:{color:'#9599A6',fontSize:9,formatter:'{b}'},labelLine:{lineStyle:{color:'rgba(224,226,242,0.12)'}},emphasis:{itemStyle:{shadowBlur:10,shadowColor:'rgba(50,240,140,0.3)'}}}]
  });
  window.addEventListener('resize',()=>chart.resize());
}

  const vals = top.map(x=>x.count).reverse();
  chart.setOption({
    tooltip:{trigger:'axis',backgroundColor:'#1A1B1D',borderColor:'rgba(224,226,242,0.16)',textStyle:{color:'#D1D3DB',fontSize:11},axisPointer:{type:'shadow'}},
    grid:{left:60,right:12,top:4,bottom:16},
    xAxis:{type:'value',axisLabel:{color:'#666B75',fontSize:9},splitLine:{lineStyle:{color:'rgba(224,226,242,0.06)'}}},
    yAxis:{type:'category',data:names,axisLabel:{color:'#9599A6',fontSize:9},axisLine:{show:false},axisTick:{show:false}},
    series:[{type:'bar',data:vals.map(v=>({value:v,itemStyle:{color:v>500?'#32F08C':v>200?'#387BFF':'#1DC981'}})),barWidth:8,barMinHeight:3}]
  });
  window.addEventListener('resize',()=>chart.resize());
}

function renderBriefsChart(d) {
  if (!echarts) return;
  const chart = echarts.init(document.getElementById('chartBriefs'));
  const recent = (d.ideas_summary||[]).slice(0,14).reverse();
  const labels = recent.map(x=>x.file.replace(/^认知简报_|^|\.md$/g,'').slice(0,10));
  const sizes = recent.map(x=>Math.round(x.size/100)*100||0);
  const has = sizes.some(s=>s>0);
  chart.setOption({
    tooltip:{trigger:'axis',backgroundColor:'#1A1B1D',borderColor:'rgba(224,226,242,0.16)',textStyle:{color:'#D1D3DB',fontSize:9}},
    grid:{left:8,right:8,top:16,bottom:32},
    xAxis:{type:'category',data:has?labels:['暂无数据'],axisLabel:{color:'#666B75',fontSize:8,rotate:45},axisLine:{lineStyle:{color:'rgba(224,226,242,0.1)'}}},
    yAxis:{type:'value',axisLabel:{color:'#666B75',fontSize:8},splitLine:{lineStyle:{color:'rgba(224,226,242,0.06)'}},show:has},
    series:[{type:'line',data:has?sizes:[0],smooth:true,symbol:'circle',symbolSize:6,lineStyle:{color:'#32F08C',width:2},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(50,240,140,0.3)'},{offset:1,color:'rgba(50,240,140,0)'}]}},itemStyle:{color:'#32F08C'}}]
  });
  window.addEventListener('resize',()=>chart.resize());
}

function renderWikiTopList(d) {
  const top = (d.top_wikilinks||[]).slice(0,10);
  document.getElementById('wikiTopList').innerHTML = top.map(x=>`<span class="wiki-tag">${x.name} <span class="freq">${x.count}</span></span>`).join('')||'<div class="empty-state">暂无数据</div>';
}

function renderIssues(d) {
  const issues = d.structural_issues||[];
  document.getElementById('issueCount').textContent = issues.length;
  document.getElementById('issueList').innerHTML = issues.length?issues.map(x=>{const dot=x.includes('异常')||x.includes('冲突')?'error':x.includes('死链')||x.includes('缺失')?'warning':'info';return `<div class="issue-item"><span class="issue-dot ${dot}"></span>${x}</div>`;}).join(''):'<div class="empty-state">没有结构性问题</div>';
}

function renderLogs(d) {
  const logs = d.recent_logs||[];
  document.getElementById('logList').innerHTML = logs.slice(0,8).map(x=>`<div class="log-item"><div class="log-date">${x.file}</div><div class="log-preview">${(x.preview||'').slice(0,120)}${(x.preview||'').length>120?'...':''}</div></div>`).join('')||'<div class="empty-state">暂无操作日志</div>';
}

function renderInbox(d) {
  const inbox = (d.inbox_backlog||[]).filter(x=>!x.file.includes('.索引'));
  document.getElementById('inboxCount').textContent = inbox.length;
  document.getElementById('inboxList').innerHTML = inbox.slice(0,10).map(x=>`<div class="log-item"><div class="log-preview">${x.title||x.file}</div><div class="log-date">${x.date||'日期未知'} · ${x.file}</div></div>`).join('')||'<div class="empty-state">Inbox 无积压素材</div>';
}

function renderLearnTrack(d) {
  document.getElementById('learnTrack').innerHTML = `<div class="summary-text"><p style="margin-bottom:6px;color:var(--text-default)">简报：${(d.ideas_summary||[]).filter(x=>x.file.includes('简报')).length} 条</p><p style="margin-bottom:6px">最近简报：${(d.ideas_summary||[]).filter(x=>x.file.includes('简报')).slice(0,1).map(x=>x.file).join('')||'暂无'}</p><p style="margin-bottom:6px">Ideas 数量：${d.summary.dir_counts.Ideas||0} 篇</p><p>知识缺口：${d.structural_issues.length>0?d.structural_issues.length+' 个待解决问题':'暂无显著缺口'}</p></div>`;
}

function renderAdvise(d) {
  const s = d.summary;
  const notes = d.notes_breakdown.Notes||{};
  const sugs = [];
  const entries = Object.entries(notes).sort((a,b)=>b[1]-a[1]);
  if (entries.length>0) { const big=entries[0]; sugs.push('「'+big[0]+'」占比 '+Math.round(big[1]/s.dir_counts.Notes*100)+'%，考虑拆分更细粒度子目录'); }
  if (s.inbox_count>0) sugs.push('Inbox 有 '+s.inbox_count+' 篇待归档，建议今日集中整理');
  const topLinks = d.top_wikilinks||[];
  const wikiNames = d.wiki_files_list||[];
  const missing = topLinks.filter(x=>x.count>=10&&!wikiNames.includes(x.name)).slice(0,6);
  if (missing.length>0) sugs.push('以下高频术语尚无 wiki 词条：'+missing.map(x=>x.name).join('、'));
  if (d.structural_issues.length>0) sugs.push('存在 '+d.structural_issues.length+' 个结构性问题待处理');
  if (d.structural_issues.some(x=>x.includes('命名冲突'))) sugs.push('修复操作日志命名冲突：统一使用下划线格式');
  if (s.broken_link_estimate>5) sugs.push('约 '+s.broken_link_estimate+' 条死链需回检清理');
  if (sugs.length===0) sugs.push('知识库状态良好，继续保持每日维护节奏');
  document.getElementById('adviseList').innerHTML = sugs.map(x=>`<div class="log-item" style="border-bottom:none;padding:4px 0"><div class="log-preview" style="font-size:11px">${x}</div></div>`).join('');
}
</script>
</body>
</html>
